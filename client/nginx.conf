server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Hashed filenames, so the content behind a given URL can never change.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Every path falls through to index.html, without which a refresh on
  # /archive is a 404 from the server rather than a route the router handles.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
