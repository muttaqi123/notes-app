name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the run in flight irrelevant, so cancel
# it rather than queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: API — lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        working-directory: server

      - run: npm run lint
        working-directory: server

      # No database service is needed: with MONGODB_URI unset the suite starts
      # its own in-memory MongoDB, which is real Mongo — real indexes, real
      # validation — with nothing to install or wait for.
      - run: npm test
        working-directory: server

  client:
    name: Web — lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
        working-directory: client

      - run: npm run lint
        working-directory: client

      - run: npm test
        working-directory: client

      - run: npm run build
        working-directory: client

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    # Only worth the browser download once the cheap checks have passed.
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: client

      - name: Start the API
        # No MONGODB_URI, so the API brings up its own in-memory database.
        run: npm start &
        working-directory: server
        env:
          NODE_ENV: development
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
          ENABLE_JOBS: 'false'

      - name: Wait for the API
        run: npx wait-on http://localhost:4000/api/health --timeout 90000

      - run: npm run test:e2e
        working-directory: client

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 7
